name: Summarize LangChain Results
description: Creates CSV and Markdown summaries from raw LangChain findings.

inputs:
  raw_findings_file:
    description: Raw JSONL findings file.
    required: true

  summary_file:
    description: CSV summary output file.
    required: true

  markdown_report:
    description: Markdown report output file.
    required: true

runs:
  using: composite
  steps:
    - name: Build CSV and Markdown reports
      shell: bash
      env:
        RAW_FINDINGS_FILE: ${{ inputs.raw_findings_file }}
        SUMMARY_FILE: ${{ inputs.summary_file }}
        MARKDOWN_REPORT: ${{ inputs.markdown_report }}
      run: |
        set -euo pipefail

        mkdir -p "$(dirname "$SUMMARY_FILE")"
        mkdir -p "$(dirname "$MARKDOWN_REPORT")"

        if [[ ! -f "$RAW_FINDINGS_FILE" ]]; then
          echo "Raw findings file not found: $RAW_FINDINGS_FILE"
          exit 1
        fi

        echo "repository,repository_url,visibility,default_branch,total_findings,python_dependency,node_dependency,python_source_usage,javascript_typescript_source_usage,notebook_usage,container_usage,other_reference,files" > "$SUMMARY_FILE"

        if [[ ! -s "$RAW_FINDINGS_FILE" ]]; then
          cat > "$MARKDOWN_REPORT" <<EOF
        # LangChain Discovery Summary

        No LangChain usage was discovered.

        EOF
          exit 0
        fi

        jq -s -r '
          group_by(.repository)
          | .[]
          | {
              repository: .[0].repository,
              repository_url: .[0].repository_url,
              visibility: .[0].visibility,
              default_branch: .[0].default_branch,
              total_findings: length,
              python_dependency: map(select(.finding_type == "python_dependency")) | length,
              node_dependency: map(select(.finding_type == "node_dependency")) | length,
              python_source_usage: map(select(.finding_type == "python_source_usage")) | length,
              javascript_typescript_source_usage: map(select(.finding_type == "javascript_typescript_source_usage")) | length,
              notebook_usage: map(select(.finding_type == "notebook_usage")) | length,
              container_usage: map(select(.finding_type == "container_usage")) | length,
              other_reference: map(select(.finding_type == "other_reference")) | length,
              files: (map(.file) | unique | join(";"))
            }
          | [
              .repository,
              .repository_url,
              .visibility,
              .default_branch,
              .total_findings,
              .python_dependency,
              .node_dependency,
              .python_source_usage,
              .javascript_typescript_source_usage,
              .notebook_usage,
              .container_usage,
              .other_reference,
              .files
            ]
          | @csv
        ' "$RAW_FINDINGS_FILE" >> "$SUMMARY_FILE"

        total_repos="$(jq -s 'map(.repository) | unique | length' "$RAW_FINDINGS_FILE")"
        total_findings="$(wc -l < "$RAW_FINDINGS_FILE" | tr -d ' ')"

        cat > "$MARKDOWN_REPORT" <<EOF
        # LangChain Discovery Summary

        ## Summary

        - Repositories with LangChain references: ${total_repos}
        - Total raw findings: ${total_findings}

        ## Repository Summary

        | Repository | Findings | Python Dependency | Node Dependency | Python Source | JS/TS Source | Notebooks | Containers | Other |
        |---|---:|---:|---:|---:|---:|---:|---:|---:|
        EOF

        jq -s -r '
          group_by(.repository)
          | .[]
          | {
              repository: .[0].repository,
              repository_url: .[0].repository_url,
              total_findings: length,
              python_dependency: map(select(.finding_type == "python_dependency")) | length,
              node_dependency: map(select(.finding_type == "node_dependency")) | length,
              python_source_usage: map(select(.finding_type == "python_source_usage")) | length,
              javascript_typescript_source_usage: map(select(.finding_type == "javascript_typescript_source_usage")) | length,
              notebook_usage: map(select(.finding_type == "notebook_usage")) | length,
              container_usage: map(select(.finding_type == "container_usage")) | length,
              other_reference: map(select(.finding_type == "other_reference")) | length
            }
          | "| [\(.repository)](\(.repository_url)) | \(.total_findings) | \(.python_dependency) | \(.node_dependency) | \(.python_source_usage) | \(.javascript_typescript_source_usage) | \(.notebook_usage) | \(.container_usage) | \(.other_reference) |"
        ' "$RAW_FINDINGS_FILE" >> "$MARKDOWN_REPORT"

        cat >> "$MARKDOWN_REPORT" <<EOF

        ## Notes

        A finding means the scanner found a LangChain-related string in source code, dependency files, notebooks, Dockerfiles, or documentation. Review dependency and source findings first, because documentation-only references may be informational rather than active usage.

        EOF

        echo "Summary file: $SUMMARY_FILE"
        echo "Markdown report: $MARKDOWN_REPORT"