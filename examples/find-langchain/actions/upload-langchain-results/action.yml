name: Upload LangChain Results
description: Uploads LangChain discovery artifacts.

inputs:
  results_dir:
    description: Directory containing discovery results.
    required: true

  artifact_name:
    description: Name of the uploaded artifact.
    required: false
    default: langchain-discovery-results

runs:
  using: composite
  steps:
    - name: Upload discovery results
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact_name }}
        path: ${{ inputs.results_dir }}
        if-no-files-found: error
        retention-days: 30