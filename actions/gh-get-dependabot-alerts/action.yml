name: Get Open Dependabot Alerts
description: Gets open Dependabot alerts for the current repository.

inputs:
  github-token:
    required: true
  output-dir:
    required: false
    default: security-results

outputs:
  alert_count:
    value: ${{ steps.fetch.outputs.alert_count }}
  output_file:
    value: ${{ steps.fetch.outputs.output_file }}
  summary:
    value: ${{ steps.fetch.outputs.summary }}

runs:
  using: composite
  steps:
    - name: Fetch open Dependabot alerts
      id: fetch
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
      run: |
        set -euo pipefail

        mkdir -p "$OUTPUT_DIR"

        OWNER="${GITHUB_REPOSITORY_OWNER}"
        REPO="${GITHUB_REPOSITORY#*/}"
        OUTPUT_FILE="$OUTPUT_DIR/open-dependabot-alerts.json"

        gh api --paginate \
          "/repos/${OWNER}/${REPO}/dependabot/alerts?state=open&per_page=100" \
          --jq '.[]' | jq -s '.' > "$OUTPUT_FILE"

        ALERT_COUNT="$(jq 'length' "$OUTPUT_FILE")"

        CRITICAL="$(jq '[.[] | select(.security_advisory.severity == "critical")] | length' "$OUTPUT_FILE")"
        HIGH="$(jq '[.[] | select(.security_advisory.severity == "high")] | length' "$OUTPUT_FILE")"
        MEDIUM="$(jq '[.[] | select(.security_advisory.severity == "medium")] | length' "$OUTPUT_FILE")"
        LOW="$(jq '[.[] | select(.security_advisory.severity == "low")] | length' "$OUTPUT_FILE")"

        SUMMARY="Open Dependabot alerts: ${ALERT_COUNT} | critical=${CRITICAL}, high=${HIGH}, medium=${MEDIUM}, low=${LOW}"

        echo "$SUMMARY"

        {
          echo "alert_count=$ALERT_COUNT"
          echo "output_file=$OUTPUT_FILE"
          echo "summary=$SUMMARY"
        } >> "$GITHUB_OUTPUT"