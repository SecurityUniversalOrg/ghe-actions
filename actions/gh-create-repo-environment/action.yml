name: Create or update repository environment
description: Create or update a GitHub environment in a repository, with optional reviewers and branch policy

inputs:
  github_host:
    description: "GitHub host (github.com or GHES hostname)"
    required: false
    default: "github.com"

  org:
    description: "Repository owner / organization"
    required: true

  repo_name:
    description: "Repository name"
    required: true

  environment_name:
    description: "Environment name, e.g. dev, test, prod, repo-create-prod"
    required: true

  # Optional protection settings
  wait_timer:
    description: "Wait timer in minutes (0-43200)"
    required: false
    default: "0"

  prevent_self_review:
    description: "true/false"
    required: false
    default: "true"

  # Optional reviewers. GitHub supports up to six reviewers total.
  reviewer_team_slugs_json:
    description: 'JSON array of team slugs, e.g. ["platform-admins","security-approvers"]'
    required: false
    default: "[]"

  reviewer_user_logins_json:
    description: 'JSON array of GitHub user logins, e.g. ["brian.kaiser","octocat"]'
    required: false
    default: "[]"

  # Optional branch policy
  protected_branches:
    description: "true/false"
    required: false
    default: "false"

  custom_branch_policies:
    description: "true/false"
    required: false
    default: "false"

  github_token:
    description: "Token with repository Administration: write"
    required: true

outputs:
  environment_id:
    description: "Environment ID"
    value: ${{ steps.apply.outputs.environment_id }}

  environment_name:
    description: "Environment name"
    value: ${{ steps.apply.outputs.environment_name }}

  environment_url:
    description: "API URL of the environment"
    value: ${{ steps.apply.outputs.environment_url }}

runs:
  using: composite
  steps:
    - id: apply
      shell: bash
      env:
        GH_HOST_INPUT: ${{ inputs.github_host }}
        TOKEN_INPUT: ${{ inputs.github_token }}
        ORG_INPUT: ${{ inputs.org }}
        REPO_NAME_INPUT: ${{ inputs.repo_name }}
        ENVIRONMENT_NAME_INPUT: ${{ inputs.environment_name }}
        WAIT_TIMER_INPUT: ${{ inputs.wait_timer }}
        PREVENT_SELF_REVIEW_INPUT: ${{ inputs.prevent_self_review }}
        REVIEWER_TEAM_SLUGS_JSON_INPUT: ${{ inputs.reviewer_team_slugs_json }}
        REVIEWER_USER_LOGINS_JSON_INPUT: ${{ inputs.reviewer_user_logins_json }}
        PROTECTED_BRANCHES_INPUT: ${{ inputs.protected_branches }}
        CUSTOM_BRANCH_POLICIES_INPUT: ${{ inputs.custom_branch_policies }}
      run: |
        set -euo pipefail

        command -v gh >/dev/null 2>&1 || { echo "ERROR: gh is required"; exit 1; }
        command -v jq >/dev/null 2>&1 || { echo "ERROR: jq is required"; exit 1; }

        if [[ "$GH_HOST_INPUT" == "github.com" ]]; then
          export GH_TOKEN="$TOKEN_INPUT"
        else
          export GH_ENTERPRISE_TOKEN="$TOKEN_INPUT"
          export GH_HOST="$GH_HOST_INPUT"
        fi

        repo="${ORG_INPUT}/${REPO_NAME_INPUT}"

        # Validate mutually-exclusive branch policy flags
        if [[ "$PROTECTED_BRANCHES_INPUT" == "$CUSTOM_BRANCH_POLICIES_INPUT" ]]; then
          echo "ERROR: protected_branches and custom_branch_policies cannot be the same value."
          echo "GitHub returns 422 when both are set to the same value."
          exit 1
        fi

        # Verify repo access first
        gh api \
          --hostname "$GH_HOST_INPUT" \
          -H "Accept: application/vnd.github+json" \
          "/repos/${repo}" >/dev/null

        reviewers_json='[]'

        # Resolve team slugs -> reviewer objects
        while IFS= read -r team_slug; do
          [[ -z "$team_slug" ]] && continue

          team_json="$(gh api \
            --hostname "$GH_HOST_INPUT" \
            -H "Accept: application/vnd.github+json" \
            "/orgs/${ORG_INPUT}/teams/${team_slug}")"

          team_id="$(jq -r '.id' <<< "$team_json")"
          if [[ -z "$team_id" || "$team_id" == "null" ]]; then
            echo "ERROR: unable to resolve team id for team slug '${team_slug}'"
            exit 1
          fi

          reviewers_json="$(jq -c \
            --argjson current "$reviewers_json" \
            --argjson tid "$team_id" \
            '$current + [{"type":"Team","id":$tid}]' <<< 'null')"
        done < <(echo "$REVIEWER_TEAM_SLUGS_JSON_INPUT" | jq -r '.[]')

        # Resolve user logins -> reviewer objects
        while IFS= read -r user_login; do
          [[ -z "$user_login" ]] && continue

          user_json="$(gh api \
            --hostname "$GH_HOST_INPUT" \
            -H "Accept: application/vnd.github+json" \
            "/users/${user_login}")"

          user_id="$(jq -r '.id' <<< "$user_json")"
          if [[ -z "$user_id" || "$user_id" == "null" ]]; then
            echo "ERROR: unable to resolve user id for login '${user_login}'"
            exit 1
          fi

          reviewers_json="$(jq -c \
            --argjson current "$reviewers_json" \
            --argjson uid "$user_id" \
            '$current + [{"type":"User","id":$uid}]' <<< 'null')"
        done < <(echo "$REVIEWER_USER_LOGINS_JSON_INPUT" | jq -r '.[]')

        reviewer_count="$(echo "$reviewers_json" | jq -r 'length')"
        if [[ "$reviewer_count" -gt 6 ]]; then
          echo "ERROR: GitHub allows up to six environment reviewers. Found: ${reviewer_count}"
          exit 1
        fi

        # URL-encode environment name for path usage
        environment_name_encoded="$(jq -rn --arg v "$ENVIRONMENT_NAME_INPUT" '$v|@uri')"

        payload="$(jq -c -n \
          --argjson wait_timer "$WAIT_TIMER_INPUT" \
          --argjson prevent_self_review "$PREVENT_SELF_REVIEW_INPUT" \
          --argjson reviewers "$reviewers_json" \
          --argjson protected_branches "$PROTECTED_BRANCHES_INPUT" \
          --argjson custom_branch_policies "$CUSTOM_BRANCH_POLICIES_INPUT" \
          '
          {
            wait_timer: $wait_timer,
            prevent_self_review: $prevent_self_review,
            reviewers: $reviewers,
            deployment_branch_policy: {
              protected_branches: $protected_branches,
              custom_branch_policies: $custom_branch_policies
            }
          }'
        )"

        tmp="$(mktemp)"
        printf '%s' "$payload" > "$tmp"

        echo "Creating/updating environment '${ENVIRONMENT_NAME_INPUT}' on repo '${repo}'"

        resp="$(gh api \
          --hostname "$GH_HOST_INPUT" \
          -X PUT \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          --input "$tmp" \
          "/repos/${repo}/environments/${environment_name_encoded}")"

        environment_id="$(jq -r '.id' <<< "$resp")"
        environment_name="$(jq -r '.name' <<< "$resp")"
        environment_url="$(jq -r '.url' <<< "$resp")"

        if [[ -z "$environment_id" || "$environment_id" == "null" ]]; then
          echo "ERROR: failed to create/update environment"
          echo "$resp" | jq .
          exit 1
        fi

        echo "environment_id=$environment_id" >> "$GITHUB_OUTPUT"
        echo "environment_name=$environment_name" >> "$GITHUB_OUTPUT"
        echo "environment_url=$environment_url" >> "$GITHUB_OUTPUT"