name: cloud-auth-aws
description: "Authenticate to AWS using OIDC (assume role)"
inputs:
  aws_region:
    required: true
  role_to_assume:
    required: true

runs:
  using: composite
  steps:
    - name: Configure AWS credentials via OIDC
      uses: SecurityUniversalOrg/ghe-actions/actions/cloud-auth-configure-aws@v1
      with:
        aws-region: ${{ inputs.aws_region }}
        role-to-assume: ${{ inputs.role_to_assume }}
        role-session-name: gha-tf-${{ github.run_id }}
