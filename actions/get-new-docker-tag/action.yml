name: "Generate a new Docker tag"
description: "Generate a new Docker tag using skopeo"
author: "SecurityUniversal"

branding:
  icon: "tag"
  color: "blue"

inputs:
  image_repo:
    description: "Name of the repo (e.g., docker.io/namespace/repo)"
    required: true
  candidate_tag:
    description: "The docker tag obtained from the matrix.yml file"
    required: true

outputs:
  new_tag:
    description: "The new docker tag that was generated"
    value: ${{ steps.calctag.outputs.new_tag }}
  base_prefix:
    description: "The base name and the period of time for the tag (base-ubuntu-2025.08)"
    value: ${{ steps.calctag.outputs.base_prefix }}
  period:
    description: "The period of time that the tag applies to ex (2025.08)"
    value: ${{ steps.calctag.outputs.period }}

runs:
  using: "composite"
  steps:
    - name: Generate new docker tag
      id: calctag
      shell: bash
      env:
        IMAGE_REPO: ${{ inputs.image_repo }}
        CANDIDATE_TAG: ${{ inputs.candidate_tag }}
      run: |
        set -euo pipefail

        cand="$CANDIDATE_TAG"

        # Extract base prefix (e.g., "24.04") and period (e.g., "2025.08") from CANDIDATE_TAG
        base="$(sed -E 's/-[0-9]{4}\.[0-9]{2}(\.P[0-9]+)?$//' <<< "$cand")"
        period="$(sed -E 's/^.*-([0-9]{4}\.[0-9]{2})(\.P[0-9]+)?$/\1/' <<< "$cand")"
        prefix="${base}-${period}"

        echo "Candidate tag:    $cand"
        echo "Base:             $base"
        echo "Period:           $period"
        echo "Prefix (base+period): $prefix"

        # Find latest matching tag in the registry for this base+period, exclude cosign attachments
        latest="$(skopeo list-tags "docker://${IMAGE_REPO}" \
          | jq -r '.Tags[]' \
          | grep -E "^${prefix}(\.P[0-9]+)?$" \
          | grep -Ev '(^sha256-|\.sig$|\.att$|\.sbom$)' \
          | sort -V | tail -n 1 || true)"

        echo "Latest matching tag for prefix '${prefix}': '${latest:-<none>}'"

        if [[ -z "$latest" ]]; then
          # No existing tag for this base+period => first one, no .P suffix
          NEW_TAG="$prefix"
        elif [[ "$latest" =~ \.P([0-9]+)$ ]]; then
          # Existing tags with .P<n> suffix => bump n
          next=$(( ${BASH_REMATCH[1]} + 1 ))
          NEW_TAG="${prefix}.P${next}"
        else
          # There is a tag equal to prefix without .P => start P1
          NEW_TAG="${prefix}.P1"
        fi

        echo "NEW_TAG=${NEW_TAG}"
        echo "new_tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"
        echo "base_prefix=${prefix}" >> "$GITHUB_OUTPUT"
        echo "period=${period}" >> "$GITHUB_OUTPUT"
