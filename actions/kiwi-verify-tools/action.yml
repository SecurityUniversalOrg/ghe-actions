name: "Kiwi Verify Tools"
description: "Verify build toolchain availability on ARC runner"
runs:
  using: "composite"
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        echo "=== Build Environment ==="
        sudo kiwi-ng --version
        qemu-img --version | head -1
        # aws, gcp and az cli are installed in the base image layers
        echo ""
        echo "=== Disk Space ==="
        df -h /app /tmp || true