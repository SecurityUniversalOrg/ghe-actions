name: "Kiwi Verify Tools"
description: "Verify build toolchain availability on ARC runner"
runs:
  using: "composite"
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        echo "=== Build Environment ==="
        sudo kiwi-ng --version
        qemu-img --version | head -1
        # aws and az cli are installed in the base image layers
        gcloud version --format='value(version)' 2>/dev/null || true
        echo ""
        echo "=== Disk Space ==="
        df -h /app /tmp || true