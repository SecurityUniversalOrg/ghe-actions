name: "Copy, Commit, Push"
description: "Copy from source dir into destination dir, record SHA, commit and push if changes exist"

inputs:
  source_dir:
    description: "Directory with source files"
    required: true
  dest_dir:
    description: "Directory of destination repo clone"
    required: true
  latest_sha:
    description: "SHA to record"
    required: true
  branch_name:
    description: "Branch to push"
    required: true

runs:
  using: "composite"
  steps:
    - name: Copy and commit changes
      shell: bash
      run: |
        set -euo pipefail

        cd "${{ inputs.dest_dir }}"

        # Copy contents (including dotfiles) safely
        shopt -s dotglob
        cp -R "../${{ inputs.source_dir }}/"* .
        shopt -u dotglob

        echo "${{ inputs.latest_sha }}" > .last_synced_sha

        git add .
        if ! git diff --cached --quiet; then
          git commit -m "Sync from GHEC @ ${{ inputs.latest_sha }}"
          git push origin "${{ inputs.branch_name }}"
        else
          echo "✅ No changes detected after copying. Nothing to commit."
        fi
