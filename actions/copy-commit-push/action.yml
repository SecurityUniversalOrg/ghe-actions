name: "Copy, Commit, Push"
description: "Copy from source dir into destination dir, record SHA, commit and push if changes exist"

inputs:
  source_dir:
    required: true
  dest_dir:
    required: true
  latest_sha:
    required: true
  branch_name:
    required: true

  # NEW:
  repo:
    description: "Destination repo owner/repo"
    required: true
  token:
    description: "PAT with write access to destination repo"
    required: true
  git_host:
    description: "GHES host (e.g. github.azg.corp.intranet)"
    required: true

runs:
  using: "composite"
  steps:
    - name: Copy and commit changes
      shell: bash
      run: |
        set -euo pipefail

        cd "${{ inputs.dest_dir }}"

        echo "Remote before:"
        git remote -v

        # Force HTTPS+PAT for origin (avoids SSH / wrong host / missing creds)
        git remote set-url origin "https://x-access-token:${{ inputs.token }}@${{ inputs.git_host }}/${{ inputs.repo }}"

        echo "Remote after:"
        git remote -v

        # Copy contents (including dotfiles)
        shopt -s dotglob
        cp -R "../${{ inputs.source_dir }}/"* .
        shopt -u dotglob

        echo "${{ inputs.latest_sha }}" > .last_synced_sha

        git add .
        if ! git diff --cached --quiet; then
          git commit -m "Sync from GHEC @ ${{ inputs.latest_sha }}"
          git push origin "${{ inputs.branch_name }}"
        else
          echo "✅ No changes detected after copying. Nothing to commit."
        fi