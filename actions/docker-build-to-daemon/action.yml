name: "Docker Build to local daemon"
description: "Build image with buildx and load into local docker daemon (single-arch)"
inputs:
  docker_repo:        { required: true }
  image:              { required: true }
  tag_primary:        { required: true }
  tag_secondary:      { required: true }
  dockerfile_path:    { required: true }
outputs:
  image_ref:
    value: ${{ steps.build.outputs.image_ref }}
  image_name:
    value: ${{ steps.build.outputs.image_name }}
  image_tags:
    value: ${{ steps.build.outputs.image_tags }}
  sbom_path:
    value: ${{ steps.build.outputs.sbom_path }}
runs:
  using: "composite"
  steps:
    - uses: docker/setup-qemu-action@v3
    - uses: docker/setup-buildx-action@v3
    - id: build
      shell: bash
      env:
        REPO: ${{ inputs.docker_repo }}
        NAME: ${{ inputs.image }}
        TAG_PRIMARY: ${{ inputs.tag_primary }}
        TAG_SECONDARY: ${{ inputs.tag_secondary }}
        DOCKERFILE_PATH: ${{ inputs.dockerfile_path }}
      run: |
        set -euo pipefail

        # Build (single-arch, loaded into local daemon)
        docker buildx build \
          --platform linux/amd64 \
          --build-arg DATE_TAG='${{ matrix.date_tag }}' \
          -t "${REPO}/${NAME}:${TAG_PRIMARY}" \
          -t "${REPO}/${NAME}:${TAG_SECONDARY}" \
          --load \
          -f "${DOCKERFILE_PATH}/Dockerfile" \
          .

        # Compute outputs
        # "image_ref" -> primary tag; "image_name" -> repository/name
        echo "image_ref=${REPO}/${NAME}:${TAG_PRIMARY}" >> "$GITHUB_OUTPUT"
        echo "image_name=${REPO}/${NAME}" >> "$GITHUB_OUTPUT"
        # (optionally expose both tags)
        echo "image_tags=${TAG_PRIMARY},${TAG_SECONDARY}" >> "$GITHUB_OUTPUT"
        SBOM_PATH="${REPO//\//-}-${NAME}"
        echo "sbom_path=${SBOM_PATH}" >> "$GITHUB_OUTPUT"

