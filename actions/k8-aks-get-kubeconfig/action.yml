name: "Get AKS kubeconfig"
description: "Fetch AKS kubeconfig and export KUBECONFIG"
inputs:
  cluster_name:
    required: true
  cluster_resource_group:
    required: true
  admin:
    description: "Use --admin credentials (true|false)"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Get AKS credentials
      shell: bash
      run: |
        set -euo pipefail

        KCFG="${GITHUB_WORKSPACE}/kubeconfig"

        ADMIN_FLAG=""
        if [[ "${{ inputs.admin }}" == "true" ]]; then
          ADMIN_FLAG="--admin"
        fi

        az aks get-credentials \
          -g "${{ inputs.cluster_resource_group }}" \
          -n "${{ inputs.cluster_name }}" \
          ${ADMIN_FLAG} \
          --overwrite-existing \
          --file "$KCFG" \
          --only-show-errors

        echo "KUBECONFIG=$KCFG" >> "$GITHUB_ENV"
        KUBECONFIG="$KCFG" kubectl cluster-info