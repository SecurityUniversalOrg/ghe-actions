name: Ensure MSBuild 16.11
description: Ensures Visual Studio 2019 Build Tools / MSBuild 16.11 is available

inputs:
  vs-version-range:
    description: Visual Studio 2019 version range
    required: false
    default: "[16.11,17.0)"

  buildtools-url:
    description: Visual Studio 2019 Build Tools bootstrapper URL
    required: false
    default: "https://aka.ms/vs/16/release/vs_buildtools.exe"

  workloads:
    description: Space-separated Visual Studio workloads/components to install
    required: false
    default: "Microsoft.VisualStudio.Workload.MSBuildTools"

outputs:
  msbuild-path:
    description: Full path to MSBuild.exe
    value: ${{ steps.find-msbuild.outputs.msbuild-path }}

runs:
  using: composite
  steps:
    - name: Install VS 2019 Build Tools if MSBuild 16.11 is missing
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"

        $vsVersionRange = '${{ inputs.vs-version-range }}'
        $buildToolsUrl  = '${{ inputs.buildtools-url }}'
        $workloads      = '${{ inputs.workloads }}'.Split(" ", [System.StringSplitOptions]::RemoveEmptyEntries)

        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $needsInstall = $false

        if (-not (Test-Path $vswhere)) {
          Write-Host "vswhere.exe not found. VS 2019 Build Tools installation required."
          $needsInstall = $true
        }
        else {
          $installPath = & $vswhere `
            -version $vsVersionRange `
            -products Microsoft.VisualStudio.Product.BuildTools Microsoft.VisualStudio.Product.Enterprise Microsoft.VisualStudio.Product.Professional Microsoft.VisualStudio.Product.Community `
            -requires Microsoft.Component.MSBuild `
            -property installationPath `
            -latest

          if ([string]::IsNullOrWhiteSpace($installPath)) {
            Write-Host "MSBuild 16.11 was not found."
            $needsInstall = $true
          }
          else {
            $msbuild = Join-Path $installPath "MSBuild\Current\Bin\MSBuild.exe"

            if (Test-Path $msbuild) {
              Write-Host "MSBuild 16.11 already exists at: $msbuild"
              $needsInstall = $false
            }
            else {
              Write-Host "Visual Studio 2019 found, but MSBuild.exe was not found."
              $needsInstall = $true
            }
          }
        }

        if ($needsInstall) {
          $installer = "$env:TEMP\vs_buildtools_2019.exe"

          Invoke-WebRequest `
            -Uri $buildToolsUrl `
            -OutFile $installer

          $args = @(
            "--quiet",
            "--wait",
            "--norestart",
            "--nocache"
          )

          foreach ($workload in $workloads) {
            $args += @("--add", $workload)
          }

          Start-Process `
            -FilePath $installer `
            -ArgumentList $args `
            -Wait `
            -NoNewWindow

          Write-Host "VS 2019 Build Tools installation completed."
        }

    - name: Find MSBuild 16.11
      id: find-msbuild
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"

        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

        $installPath = & $vswhere `
          -version '${{ inputs.vs-version-range }}' `
          -products Microsoft.VisualStudio.Product.BuildTools Microsoft.VisualStudio.Product.Enterprise Microsoft.VisualStudio.Product.Professional Microsoft.VisualStudio.Product.Community `
          -requires Microsoft.Component.MSBuild `
          -property installationPath `
          -latest

        if ([string]::IsNullOrWhiteSpace($installPath)) {
          throw "Unable to locate Visual Studio 2019 / MSBuild 16.11 after installation."
        }

        $msbuild = Join-Path $installPath "MSBuild\Current\Bin\MSBuild.exe"

        if (-not (Test-Path $msbuild)) {
          throw "MSBuild.exe not found at expected path: $msbuild"
        }

        Write-Host "Using MSBuild at: $msbuild"

        "MSBUILD_PATH=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Append
        "msbuild-path=$msbuild" | Out-File -FilePath $env:GITHUB_OUTPUT -Append