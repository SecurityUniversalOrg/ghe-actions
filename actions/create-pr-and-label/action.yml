name: "Create PR and Label"
description: "Create a PR via API and apply a label for dedupe"

inputs:
  repo:
    description: "owner/repo (destination)"
    required: true
  token:
    description: "PAT with pull request + issues write permissions"
    required: true
  api_url:
    description: "GitHub API base URL"
    required: false
    default: "https://api.github.com"
  title:
    description: "PR title"
    required: true
  head:
    description: "Head branch name"
    required: true
  base:
    description: "Base branch name"
    required: true
  body:
    description: "PR body"
    required: true
  label:
    description: "Label to add to the PR issue"
    required: true

outputs:
  pr_number:
    description: "Created PR number"
    value: ${{ steps.pr.outputs.pr_number }}

runs:
  using: "composite"
  steps:
    - name: Create PR
      id: pr
      shell: bash
      run: |
        set -euo pipefail

        PAYLOAD="$(jq -n \
          --arg title "${{ inputs.title }}" \
          --arg head  "${{ inputs.head }}" \
          --arg base  "${{ inputs.base }}" \
          --arg body  "${{ inputs.body }}" \
          '{title:$title, head:$head, base:$base, body:$body}')"

        echo "Create PR URL: ${{ inputs.api_url }}/repos/${{ inputs.repo }}/pulls"
        echo "Payload (sanitized):"
        echo "$PAYLOAD" | jq .

        BODY_FILE="$(mktemp)"
        ERR_FILE="$(mktemp)"

        # IMPORTANT: --fail-with-body makes curl exit nonzero on 4xx/5xx but still keeps the JSON body
        HTTP_CODE="$(
          curl -sS --fail-with-body \
            -o "$BODY_FILE" \
            -w "%{http_code}" \
            -X POST \
            -H "Authorization: token ${{ inputs.token }}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "${{ inputs.api_url }}/repos/${{ inputs.repo }}/pulls" \
            -d "$PAYLOAD" \
            2>"$ERR_FILE" || true
        )"

        echo "HTTP code: ${HTTP_CODE:-<none>}"

        echo "curl stderr (if any):"
        cat "$ERR_FILE" || true

        echo "Response body:"
        cat "$BODY_FILE" || true
        echo

        PR_NUMBER="$(jq -r '.number // empty' < "$BODY_FILE" || true)"

        if [[ -z "$PR_NUMBER" ]]; then
          echo "Failed to create PR (no .number in response)."
          exit 1
        fi

        echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

    - name: Add label to PR
      shell: bash
      run: |
        set -euo pipefail
        curl -sS -X POST \
          -H "Authorization: token ${{ inputs.token }}" \
          -H "Accept: application/vnd.github+json" \
          "${{ inputs.api_url }}/repos/${{ inputs.repo }}/issues/${{ steps.pr.outputs.pr_number }}/labels" \
          -d "$(jq -n --arg label "${{ inputs.label }}" '[ $label ]')"
