name: Print runner group request summary
description: Print a normalized summary of the runner group assignment request

inputs:
  github_host:
    required: true
  org:
    required: true
  repo_name:
    required: true
  runner_group_names_json:
    required: true
  runner_group_ids_json:
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GITHUB_HOST_INPUT: ${{ inputs.github_host }}
        ORG_INPUT: ${{ inputs.org }}
        REPO_NAME_INPUT: ${{ inputs.repo_name }}
        RUNNER_GROUP_NAMES_JSON_INPUT: ${{ inputs.runner_group_names_json }}
        RUNNER_GROUP_IDS_JSON_INPUT: ${{ inputs.runner_group_ids_json }}
      run: |
        set -euo pipefail

        command -v jq >/dev/null 2>&1 || { echo "ERROR: jq is required"; exit 1; }

        echo "Runner group request summary"
        echo "  Host:               $GITHUB_HOST_INPUT"
        echo "  Organization:       $ORG_INPUT"
        echo "  Repository:         $REPO_NAME_INPUT"
        echo "  Runner group names: $(echo "$RUNNER_GROUP_NAMES_JSON_INPUT" | jq -cr '.')"
        echo "  Runner group ids:   $(echo "$RUNNER_GROUP_IDS_JSON_INPUT" | jq -cr '.')"