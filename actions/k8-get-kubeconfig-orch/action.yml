name: "Get Kubeconfig (Orchestrator)"
description: "Install tooling + auth + produce kubeconfig for AKS/EKS"
inputs:
  cloud:
    description: "azure|aws"
    required: true
  cluster_name:
    required: true
  cluster_resource_group:
    required: false
  aws_region:
    required: false

runs:
  using: "composite"
  steps:
    - uses: ./.github/actions/install-kubectl
    - uses: ./.github/actions/install-helm

    # Azure
    - name: Azure login
      if: ${{ inputs.cloud == 'azure' }}
      uses: ./.github/actions/azure-login-oidc

    - name: AKS kubeconfig
      if: ${{ inputs.cloud == 'azure' }}
      uses: ./.github/actions/aks-get-kubeconfig
      with:
        cluster_name: ${{ inputs.cluster_name }}
        cluster_resource_group: ${{ inputs.cluster_resource_group }}
        admin: "true"

    # AWS
    - name: AWS configure creds
      if: ${{ inputs.cloud == 'aws' }}
      uses: ./.github/actions/aws-configure-oidc
      with:
        aws_region: ${{ inputs.aws_region }}

    - name: EKS kubeconfig
      if: ${{ inputs.cloud == 'aws' }}
      uses: ./.github/actions/eks-get-kubeconfig
      with:
        cluster_name: ${{ inputs.cluster_name }}
        aws_region: ${{ inputs.aws_region }}