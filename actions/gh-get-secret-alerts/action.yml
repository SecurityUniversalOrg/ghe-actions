name: Get Open Secret Scanning Alerts
description: Gets open secret scanning alerts for the current repository.

inputs:
  github-token:
    required: true
  output-dir:
    required: false
    default: security-results

outputs:
  alert_count:
    value: ${{ steps.fetch.outputs.alert_count }}
  output_file:
    value: ${{ steps.fetch.outputs.output_file }}
  summary:
    value: ${{ steps.fetch.outputs.summary }}

runs:
  using: composite
  steps:
    - name: Fetch open secret scanning alerts
      id: fetch
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
      run: |
        set -euo pipefail

        mkdir -p "$OUTPUT_DIR"

        OWNER="${GITHUB_REPOSITORY_OWNER}"
        REPO="${GITHUB_REPOSITORY#*/}"
        OUTPUT_FILE="$OUTPUT_DIR/open-secret-scanning-alerts.json"

        gh api --paginate \
          "/repos/${OWNER}/${REPO}/secret-scanning/alerts?state=open&per_page=100" \
          --jq '.[]' | jq -s '.' > "$OUTPUT_FILE"

        ALERT_COUNT="$(jq 'length' "$OUTPUT_FILE")"

        SUMMARY="Open secret scanning alerts: ${ALERT_COUNT}"

        echo "$SUMMARY"

        {
          echo "alert_count=$ALERT_COUNT"
          echo "output_file=$OUTPUT_FILE"
          echo "summary=$SUMMARY"
        } >> "$GITHUB_OUTPUT"