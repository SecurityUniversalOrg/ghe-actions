name: Build • Scan • Sign • Push
on:
  workflow_call:
    inputs:
      context:         { required: true,  type: string }
      dockerfile:      { required: true,  type: string }
      image_name:      { required: true,  type: string }
      tags:            { required: true,  type: string }
    secrets:
      dockerhub_username: { required: false }
      dockerhub_token:    { required: false }

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login Docker Hub (optional)
        if: secrets.dockerhub_username && secrets.dockerhub_token
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.dockerhub_username }}
          password: ${{ secrets.dockerhub_token }}
      - name: Build to daemon
        id: build
        uses: SecurityUniversalOrg/platform-actions/actions/docker-build-to-daemon@main
        with:
          context:    ${{ inputs.context }}
          dockerfile: ${{ inputs.dockerfile }}
          image:      ${{ inputs.image_name }}
          tags:       ${{ inputs.tags }}
      - name: Scan (daemon image primary tag)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: "${{ steps.build.outputs.primary_ref }}"
          format:     'table'
          exit-code:  '1'
          ignore-unfixed: true
          severity:   'CRITICAL,HIGH'
      - name: Push both tags
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -ra T <<< "${{ inputs.tags }}"
          for t in "${T[@]}"; do
            docker push "${{ inputs.image_name }}:${t}"
          done
